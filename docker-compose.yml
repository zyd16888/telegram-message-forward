services:
  app:
    image: ghcr.io/zyd16888/telegram-message-forward:nightly
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${TMF_HTTP_PORT:-8080}:8080"
    environment:
      TMF_SERVER_ADDR: ":8080"
      TMF_LOG_LEVEL: "${TMF_LOG_LEVEL:-info}"
      TMF_LOG_FORMAT: "${TMF_LOG_FORMAT:-text}"
      TMF_DATABASE_DSN: "${TMF_DATABASE_DSN:?set TMF_DATABASE_DSN in .env}"
      TMF_DATABASE_AUTO_MIGRATE: "${TMF_DATABASE_AUTO_MIGRATE:-true}"
      TMF_SECURITY_ENCRYPTION_KEY: "${TMF_SECURITY_ENCRYPTION_KEY:?set TMF_SECURITY_ENCRYPTION_KEY in .env}"
      TMF_SECURITY_AUTH_ENABLED: "${TMF_SECURITY_AUTH_ENABLED:-true}"
      TMF_DISPATCH_WORKER_COUNT: "${TMF_DISPATCH_WORKER_COUNT:-2}"
      TMF_DISPATCH_POLL_INTERVAL: "${TMF_DISPATCH_POLL_INTERVAL:-2s}"
      TMF_DISPATCH_VISIBILITY_TIMEOUT: "${TMF_DISPATCH_VISIBILITY_TIMEOUT:-5m}"
      TMF_DISPATCH_MAX_ATTEMPTS: "${TMF_DISPATCH_MAX_ATTEMPTS:-3}"
