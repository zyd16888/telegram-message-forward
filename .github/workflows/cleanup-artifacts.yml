name: Cleanup artifacts

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: Delete artifacts older than this many days
        required: false
        default: "7"
      keep_latest:
        description: Always keep this many newest artifacts
        required: false
        default: "5"
      dry_run:
        description: Print what would be deleted without deleting
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete old artifacts
    runs-on: ubuntu-latest
    env:
      ARTIFACT_RETENTION_DAYS: ${{ github.event.inputs.retention_days || '7' }}
      KEEP_LATEST_ARTIFACTS: ${{ github.event.inputs.keep_latest || '5' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Delete expired artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const retentionDays = Number(process.env.ARTIFACT_RETENTION_DAYS || '7');
            const keepLatest = Number(process.env.KEEP_LATEST_ARTIFACTS || '5');
            const dryRun = String(process.env.DRY_RUN || 'false') === 'true';

            if (!Number.isFinite(retentionDays) || retentionDays < 0) {
              core.setFailed(`Invalid retention days: ${process.env.ARTIFACT_RETENTION_DAYS}`);
              return;
            }

            if (!Number.isInteger(keepLatest) || keepLatest < 0) {
              core.setFailed(`Invalid keep latest count: ${process.env.KEEP_LATEST_ARTIFACTS}`);
              return;
            }

            const { owner, repo } = context.repo;
            const cutoff = Date.now() - retentionDays * 24 * 60 * 60 * 1000;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            const sortedArtifacts = artifacts.sort((left, right) => {
              return Date.parse(right.created_at) - Date.parse(left.created_at);
            });
            const protectedIds = new Set(
              sortedArtifacts.slice(0, keepLatest).map((artifact) => artifact.id),
            );
            const deleteTargets = sortedArtifacts.filter((artifact) => {
              return Date.parse(artifact.created_at) < cutoff && !protectedIds.has(artifact.id);
            });

            core.info(`Found ${artifacts.length} artifacts.`);
            core.info(`Retention days: ${retentionDays}; keep latest: ${keepLatest}; dry run: ${dryRun}.`);
            core.info(`Delete targets: ${deleteTargets.length}.`);

            for (const artifact of deleteTargets) {
              const message = `${artifact.name} (${artifact.id}), created at ${artifact.created_at}`;
              if (dryRun) {
                core.info(`[dry-run] Would delete ${message}`);
                continue;
              }

              core.info(`Deleting ${message}`);
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }
